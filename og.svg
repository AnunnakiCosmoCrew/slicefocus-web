<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Open Graph card: wordmark, maker line, the line, the description, and the signature day.
       The clock is the weekday plan the demo account is seeded with (SliceFocusFE
       tool/screenshots/seed.py: WEEKDAY and CATEGORIES), the same day the App Store
       screenshots and the hero video show. 00:00 at the top, clockwise.
       The plan leaves three spans free (18:00-18:30, 19:30-20:00, 21:00-22:30); they show
       the lighter disc underneath, as free time does in the app.
       Source for og.png: rsvg-convert -w 1200 -h 630 og.svg -o og.png. ADR-042: minimal and sincere. -->
  <rect width="1200" height="630" fill="#f3f5f0"/>

  <text x="96" y="232" font-family="Iowan Old Style, Palatino, Georgia, serif"
        font-size="104" font-weight="600" fill="#16211c" letter-spacing="-1.5">SliceFocus</text>
  <text x="102" y="274" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="22" fill="#56655d" letter-spacing="0.5">by CosmoCrew</text>
  <text x="100" y="356" font-family="Iowan Old Style, Palatino, Georgia, serif"
        font-size="40" fill="#2d4a3e">Plan your day on a clock.</text>
  <text x="100" y="408" font-family="Iowan Old Style, Palatino, Georgia, serif"
        font-size="40" fill="#2d4a3e">It runs itself.</text>
  <rect x="102" y="448" width="116" height="6" rx="3" fill="#3c7a5e"/>
  <text x="100" y="512" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="24" fill="#56655d">A day planner on a 24-hour clock, with a Pomodoro timer</text>
  <text x="100" y="546" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="24" fill="#56655d">that runs its rounds by itself on iPhone and Mac.</text>

  <!-- The signature day. The disc is free time; the wedges are the planned blocks. -->
  <circle cx="930" cy="315" r="200" fill="#e4e8e0"/>
  <path d="M 930 315 L 930.0 115.0 A 200 200 0 0 1 1128.3 341.1 Z" fill="#8A8F98" stroke="#f3f5f0" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 930 315 L 1128.3 341.1 A 200 200 0 0 1 1119.4 379.3 Z" fill="#43AA8B" stroke="#f3f5f0" stroke-width="2.5" stroke-linejoin="round"/>
