  <text x="930.0" y="94.0" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#56655d">00</text>
  <text x="1158.0" y="322.0" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#56655d">06</text>
  <text x="930.0" y="550.0" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#56655d">12</text>
  <text x="702.0" y="322.0" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#56655d">18</text>
</svg>
